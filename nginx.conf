# Nginx 配置 — TurboNeko Studio
# 保存为 /etc/nginx/conf.d/turboneko.conf  (CentOS)
# 或 /etc/nginx/sites-available/turboneko  (Ubuntu, 需 ln -s 到 sites-enabled)
#
# 服务器公网IP: 39.106.44.159
# 域名: nachocrazy.top

server {
    listen 80;
    listen [::]:80;
    server_name nachocrazy.top www.nachocrazy.top;

    root /var/www/turboneko;
    index index.html;

    # Logo 等静态资源缓存 30 天
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Gzip 压缩
    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/html;

    # 主页面
    location / {
        try_files $uri $uri/ =404;
    }
}
